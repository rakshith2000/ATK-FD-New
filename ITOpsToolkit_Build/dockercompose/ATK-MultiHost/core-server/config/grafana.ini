[server]
serve_from_sub_path = true
root_url = https://backend-atkdev.familydollar.com/grafana

[security]
admin_user = $__env{GF_SECURITY_ADMIN_USER}
admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD}

# The Frontend (https://autonomousitopstoolkitdev.familydollar.com) is a
# different origin, so embedding and cross-site cookies must be allowed.
allow_embedding = true
cookie_samesite = none
cookie_secure = true
