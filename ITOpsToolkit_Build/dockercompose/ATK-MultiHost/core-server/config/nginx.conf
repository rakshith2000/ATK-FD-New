# ═══════════════════════════════════════════════════════════════════════════════
#  ATK CORE SERVER NGINX  —  10.106.6.15
#
#  Name-based virtual hosts (all three A records point at this VM):
#    sso-atkdev.familydollar.com      ->  keycloak:8080         (relative path /auth)
#    vault-atkdev.familydollar.com    ->  vault:8200
#    backend-atkdev.familydollar.com  ->  backend:8000  (/api, /iac_assist_socket)
#                                         grafana:3000           (/grafana)
#                                         litellm:4000           (/litellm)
#                                         agentgateway-ui:19000  (/ui)
#                                         agentgateway-engine    (/agentgateway, /mcp)
#
#  TLS: place fullchain.pem + privkey.pem in ./ssl  (must be valid for all three
#       names — use a SAN or wildcard cert for *.familydollar.com)
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    # Docker embedded DNS — lets nginx boot even when an upstream container is down
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # WebSocket upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS redirect (all hosts) ─────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Catch-all: requests that do not carry a known Host header ─────────
    # 404 rather than 444: 444 drops the connection with no response, which in
    # a browser or curl is indistinguishable from "the server is down" and makes
    # a DNS/SNI mismatch very hard to diagnose.
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        return 404;
    }

    # ═══════════════════════════════════════════════════════════════════════
    #  KEYCLOAK  —  https://sso-atkdev.familydollar.com/auth
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name sso-atkdev.familydollar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so send the bare
        # hostname to the console instead of returning 404.
        location = / {
            return 302 https://$host/auth/;
        }

        location / {
            set $upstream_keycloak keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_keycloak;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    #  HASHICORP VAULT  —  https://vault-atkdev.familydollar.com
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name vault-atkdev.familydollar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        location / {
            set $upstream_vault vault:8200;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_vault;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    #  BACKEND + PLATFORM SERVICES  —  https://backend-atkdev.familydollar.com
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name backend-atkdev.familydollar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        # ── Bare-prefix redirects ──────────────────────────────────────────
        # app-config.json / config.json link to ".../grafana" and ".../ui"
        # WITHOUT a trailing slash. A `location /grafana/` prefix never matches
        # "/grafana", so those links would fall through to the catch-all 404.
        location = /grafana  { return 301 https://$host/grafana/; }
        location = /litellm  { return 301 https://$host/litellm/; }
        location = /ui       { return 301 https://$host/ui/; }
        location = /agentgateway { return 301 https://$host/agentgateway/; }

        # ── LiteLLM AI Proxy (/litellm/) ───────────────────────────────────
        location /litellm/ {
            set $upstream_litellm litellm:4000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_litellm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Grafana Observability Dashboard (/grafana/) ───────────────────
        location /grafana/ {
            set $upstream_grafana grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # Grafana live/streaming channel
        location /grafana/api/live/ {
            set $upstream_grafana_live grafana:3000;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_grafana_live;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Agent Gateway UI (/ui/) ────────────────────────────────────────
        # The Admin portal embeds this in an <iframe> served from the Frontend
        # host, so the upstream's same-origin framing headers are replaced with
        # an explicit frame-ancestors allowance for that origin.
        location /ui/ {
            set $upstream_agw_ui agentgateway-ui:19000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_agw_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "frame-ancestors 'self' https://autonomousitopstoolkitdev.familydollar.com" always;
        }

        # ── Agent Gateway Engine (/agentgateway/ & /mcp) ───────────────────
        location /agentgateway/ {
            set $upstream_agw_engine agentgateway-engine:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_agw_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        location /mcp {
            set $upstream_agw_mcp agentgateway-engine:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_agw_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Agent Gateway UI Config/Runtime API overrides (must precede /api/) ─
        #
        # These MUST use a variable upstream like every other block in this file.
        # A literal `proxy_pass http://agentgateway-ui:19000/...` is resolved at
        # config-parse time, so if that container is not running nginx aborts
        # with `[emerg] host not found in upstream` and the whole proxy dies —
        # taking Keycloak, Vault and the Backend down with it. With `set` +
        # `resolver` the name is resolved per-request and a missing Agent
        # Gateway degrades to a 502 on these paths only.
        location = /api/config {
            set $agw_ui_config agentgateway-ui:19000;
            proxy_pass http://$agw_ui_config/api/config;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/runtime {
            set $agw_ui_runtime agentgateway-ui:19000;
            proxy_pass http://$agw_ui_runtime/api/runtime;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/costs/models {
            set $agw_ui_costs agentgateway-ui:19000;
            proxy_pass http://$agw_ui_costs/api/costs/models;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/costs/refresh-base {
            set $agw_ui_refresh agentgateway-ui:19000;
            proxy_pass http://$agw_ui_refresh/api/costs/refresh-base;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/cel {
            set $agw_ui_cel agentgateway-ui:19000;
            proxy_pass http://$agw_ui_cel/api/cel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/logs {
            set $agw_ui_logs agentgateway-ui:19000;
            proxy_pass http://$agw_ui_logs/api/logs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/logs/analytics/summary {
            set $agw_engine_admin agentgateway-engine:15000;
            proxy_pass http://$agw_engine_admin/api/logs/analytics/summary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Backend API (/api/) ───────────────────────────────────────────
        # FastAPI runs with root_path="/api", so the prefix is forwarded as-is.
        location /api/ {
            set $upstream_backend backend:8000;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── IAC WebSocket (wss://.../iac_assist_socket/ws/) ───────────────
        location /iac_assist_socket/ {
            set $upstream_backend_ws backend:8000;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_backend_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── FastAPI Swagger UI / OpenAPI ──────────────────────────────────
        location = /openapi.json {
            set $upstream_backend_openapi backend:8000;
            proxy_pass http://$upstream_backend_openapi/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Health probe ──────────────────────────────────────────────────
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # No frontend on this host — send the bare hostname to Swagger.
        location = / {
            return 301 https://$host/api/docs;
        }

        location / {
            return 404;
        }
    }
}
