# ═══════════════════════════════════════════════════════════════════════════════
#  ATK FRONTEND SERVER NGINX  —  10.106.6.228
#
#  Virtual host:
#    autonomousitopstoolkitdev.familydollar.com  ->  static SPA bundle
#
#  The browser talks directly to the core server for everything else:
#    https://backend-atkdev.familydollar.com/api      (REST)
#    wss://backend-atkdev.familydollar.com/iac_assist_socket/ws/
#    https://sso-atkdev.familydollar.com/auth         (Keycloak)
#    https://backend-atkdev.familydollar.com/grafana  (ATK Pulse)
#
#  TLS: place fullchain.pem + privkey.pem in ./ssl
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # nginx 1.21.1+ maps .js to "text/javascript" in mime.types, older builds use
    # "application/javascript". Both are listed, otherwise the JS bundle — by far
    # the largest thing this server sends — silently ships uncompressed.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Catch-all: requests that do not carry a known Host header ─────────
    # The body names the Host that failed to match, so a bare 404 here is never
    # confused with a 404 from the SPA vhost (which sets X-ATK-Vhost: frontend).
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        add_header X-ATK-Vhost "catchall" always;
        default_type text/plain;
        return 404 "ATK frontend: no vhost matched Host='$host'.\nExpected 'autonomousitopstoolkitdev.familydollar.com'.\n";
    }

    # ═══════════════════════════════════════════════════════════════════════
    #  FRONTEND  —  https://autonomousitopstoolkitdev.familydollar.com
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name autonomousitopstoolkitdev.familydollar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        # No `index` directive on purpose — see the SPA fallback below.

        # ── Immutable build output ─────────────────────────────────────────
        # Vite writes content-hashed filenames into these four directories
        # (assets/js, assets/css, assets/img, assets/fonts — see
        # rolldownOptions.output in vite.config.ts). A new build produces new
        # names, so these can be cached forever.
        location /assets/js/    { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
        location /assets/css/   { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
        location /assets/img/   { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
        location /assets/fonts/ { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }

        # ── Static files copied verbatim from public/ ──────────────────────
        # public/assets/{knowledge-ai,module-icons,shared} land here with their
        # ORIGINAL filenames — no hash. Marking them immutable for a year would
        # mean a replaced category icon or module icon never reaches a browser
        # that has already seen it. Short cache + revalidation instead.
        location /assets/ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
            try_files $uri =404;
        }

        # ── Runtime configuration — never cache ────────────────────────────
        # Loaded by the SPA at boot (loadAppConfig()). Caching these would mean
        # an endpoint change needs a browser hard-refresh to take effect.
        location = /app-config.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location = /config.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location = /license.txt {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── SPA routing fallback ───────────────────────────────────────────
        # index.html must not be cached, or a deploy leaves browsers requesting
        # hashed chunks that no longer exist.
        #
        # Note there is no `$uri/` in try_files and no reliance on the `index`
        # directive. An SPA never needs directory indexes, and both of those
        # make an EMPTY bundle volume fail as "403 Forbidden" (directory listing
        # denied on the docroot) — which reads like a permissions problem and
        # sends you chasing the wrong thing. Testing /index.html as a plain file
        # instead routes that case to @empty_bundle, which says what is wrong.
        location = / {
            add_header Cache-Control "no-cache" always;
            add_header X-ATK-Vhost "frontend" always;
            try_files /index.html @empty_bundle;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-ATK-Vhost "frontend" always;
            try_files $uri /index.html @empty_bundle;
        }

        # Reached only when /usr/share/nginx/html/index.html does not exist,
        # i.e. frontend-builder never populated the frontend_dist volume.
        location @empty_bundle {
            add_header X-ATK-Vhost "frontend" always;
            default_type text/plain;
            return 503 "ATK frontend: vhost matched OK, but /usr/share/nginx/html/index.html is missing.\nThe frontend_dist volume is empty - run: docker compose logs frontend-builder\n";
        }

        # ───────────────────────────────────────────────────────────────────
        #  OPTIONAL — same-origin API proxy (see README §7).
        #
        #  Uncomment ONLY if you would rather keep the browser on a single
        #  origin (no CORS, no preflight). If you enable it:
        #
        #   1. Uncomment the `resolver` line AND all four location blocks.
        #      The resolver is mandatory — these use a variable upstream so
        #      that an unreachable core server yields a 502 instead of
        #      preventing nginx from starting at all. Docker's embedded DNS at
        #      127.0.0.11 forwards external names to the host's resolvers.
        #
        #   2. In ./config/app-config.json revert to relative paths:
        #        backend.api.baseUrl   -> "/api"
        #        externalLinks.*       -> "/grafana"
        #        iframes.agentGateway  -> "/ui/"
        #
        #   3. In ./config/config.json use "/api" and
        #        wss://autonomousitopstoolkitdev.familydollar.com/iac_assist_socket/ws/
        #
        #  Keycloak stays on sso-atkdev either way.
        # ───────────────────────────────────────────────────────────────────
        #
        # resolver 127.0.0.11 valid=30s;
        # resolver_timeout 5s;
        #
        # location /api/ {
        #     set $atk_core backend-atkdev.familydollar.com;
        #     proxy_pass https://$atk_core;
        #     proxy_ssl_server_name on;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host              $atk_core;
        #     proxy_set_header X-Real-IP         $remote_addr;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto https;
        #     proxy_connect_timeout 30s;
        #     proxy_send_timeout    450s;
        #     proxy_read_timeout    450s;
        # }
        #
        # location /iac_assist_socket/ {
        #     set $atk_core_ws backend-atkdev.familydollar.com;
        #     proxy_pass https://$atk_core_ws;
        #     proxy_ssl_server_name on;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host              $atk_core_ws;
        #     proxy_set_header Upgrade           $http_upgrade;
        #     proxy_set_header Connection        $connection_upgrade;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto https;
        #     proxy_read_timeout 3600s;
        #     proxy_send_timeout 3600s;
        # }
        #
        # location /grafana/ {
        #     set $atk_core_grafana backend-atkdev.familydollar.com;
        #     proxy_pass https://$atk_core_grafana;
        #     proxy_ssl_server_name on;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host              $atk_core_grafana;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto https;
        #     proxy_set_header Upgrade           $http_upgrade;
        #     proxy_set_header Connection        $connection_upgrade;
        # }
        #
        # location /ui/ {
        #     set $atk_core_ui backend-atkdev.familydollar.com;
        #     proxy_pass https://$atk_core_ui;
        #     proxy_ssl_server_name on;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host              $atk_core_ui;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto https;
        # }
    }
}
