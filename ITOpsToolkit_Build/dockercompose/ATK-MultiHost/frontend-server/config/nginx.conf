# ═══════════════════════════════════════════════════════════════════════════════
#  ATK FRONTEND SERVER NGINX  —  10.106.6.228
#
#  Virtual host:
#    autonomousitopstoolkitdev.familydollar.com  ->  static SPA bundle
#
#  The browser talks directly to the core server for everything else:
#    https://backend-atkdev.familydollar.com/api      (REST)
#    wss://backend-atkdev.familydollar.com/iac_assist_socket/ws/
#    https://sso-atkdev.familydollar.com/auth         (Keycloak)
#    https://backend-atkdev.familydollar.com/grafana  (ATK Pulse)
#
#  TLS: place fullchain.pem + privkey.pem in ./ssl
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Catch-all: reject unknown Host headers ────────────────────────────
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        return 444;
    }

    # ═══════════════════════════════════════════════════════════════════════
    #  FRONTEND  —  https://autonomousitopstoolkitdev.familydollar.com
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name autonomousitopstoolkitdev.familydollar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        root  /usr/share/nginx/html;
        index index.html;

        # Hashed build assets — safe to cache forever
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # Runtime configuration must never be cached, otherwise a config change
        # needs a browser hard-refresh to take effect.
        location = /app-config.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location = /config.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SPA routing fallback
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        # ───────────────────────────────────────────────────────────────────
        #  OPTIONAL — same-origin API proxy.
        #
        #  Uncomment this block ONLY if you would rather keep the browser on a
        #  single origin (no CORS, no preflight). If you enable it, set these
        #  back to relative paths in ./config/app-config.json:
        #     backend.api.baseUrl      -> "/api"
        #     externalLinks.*          -> "/grafana"
        #     iframes.agentGateway     -> "/ui/"
        #  and in ./config/config.json use "/api" + "wss://<this host>/...".
        # ───────────────────────────────────────────────────────────────────
        #
        # location /api/ {
        #     proxy_pass https://backend-atkdev.familydollar.com;
        #     proxy_ssl_server_name on;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host              backend-atkdev.familydollar.com;
        #     proxy_set_header X-Real-IP         $remote_addr;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto https;
        #     proxy_connect_timeout 30s;
        #     proxy_send_timeout    450s;
        #     proxy_read_timeout    450s;
        # }
        #
        # location /iac_assist_socket/ {
        #     proxy_pass https://backend-atkdev.familydollar.com;
        #     proxy_ssl_server_name on;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host              backend-atkdev.familydollar.com;
        #     proxy_set_header Upgrade           $http_upgrade;
        #     proxy_set_header Connection        $connection_upgrade;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
