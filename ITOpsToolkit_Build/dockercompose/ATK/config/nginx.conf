worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server (Port 443) ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Keycloak Authentication (/auth/) ───────────────────────────────
        location /auth/ {
            set $upstream_keycloak integration.autonomousitopstoolkit.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass https://$upstream_keycloak;
            proxy_set_header Host integration.autonomousitopstoolkit.com;
            proxy_set_header X-Forwarded-Host integration.autonomousitopstoolkit.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── LiteLLM AI Proxy (/litellm/) ───────────────────────────────────
        location /litellm/ {
            set $upstream_litellm litellm:4000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_litellm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Grafana Observability Dashboard (/grafana/) ───────────────────
        location /grafana/ {
            set $upstream_grafana grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Agent Gateway UI (/ui/) ────────────────────────────────────────
        location /ui/ {
            set $upstream_agw_ui agentgateway-ui:19000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_agw_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Agent Gateway Engine (/agentgateway/ & /mcp) ───────────────────
        location /agentgateway/ {
            set $upstream_agw_engine agentgateway-engine:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_agw_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        location /mcp {
            set $upstream_agw_mcp agentgateway-engine:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_agw_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Agent Gateway UI Config/Runtime API overrides (must precede /api/) ─
        location = /api/config {
            proxy_pass http://agentgateway-ui:19000/api/config;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/runtime {
            proxy_pass http://agentgateway-ui:19000/api/runtime;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/costs/models {
            proxy_pass http://agentgateway-ui:19000/api/costs/models;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/costs/refresh-base {
            proxy_pass http://agentgateway-ui:19000/api/costs/refresh-base;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/cel {
            proxy_pass http://agentgateway-ui:19000/api/cel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/logs {
            proxy_pass http://agentgateway-ui:19000/api/logs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/logs/analytics/summary {
            proxy_pass http://agentgateway-engine:15000/api/logs/analytics/summary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Backend API (/api/) ───────────────────────────────────────────
        location /api/ {
            set $upstream_backend backend:8000;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── IAC WebSocket (wss://.../iac_assist_socket/ws/) ───────────────
        location /iac_assist_socket/ {
            set $upstream_backend_ws backend:8000;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_backend_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── FastAPI Swagger UI / OpenAPI ──────────────────────────────────
        location = /openapi.json {
            set $upstream_backend_openapi backend:8000;
            proxy_pass http://$upstream_backend_openapi/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Frontend Web UI (/ - Catch-All, served from shared volume) ────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HashiCorp Vault (Dedicated HTTPS on Port 8443) ────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            set $upstream_vault vault:8200;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_vault;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }
    }
}
